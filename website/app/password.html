<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Parola contului · Flowrise Dental Studio</title>
  <link rel="icon" type="image/svg+xml" href="assets/flowrise-tooth.svg?v=2">
  <link rel="stylesheet" href="password.css?v=1">
</head>
<body>
  <main class="password-card">
    <img class="password-mark" src="assets/flowrise-tooth.svg" alt="Flowrise Dental Studio" width="56" height="56">
    <h1 id="passwordTitle">Parola contului</h1>
    <p id="passwordDescription">Verific sesiunea…</p>
    <form id="recoveryForm" hidden>
      <label for="recoveryEmail">Emailul contului</label>
      <input id="recoveryEmail" type="email" autocomplete="email" required maxlength="320">
      <div id="recoveryCaptcha"></div>
      <p id="captchaStatus" role="status"></p>
      <button id="requestReset" type="submit" disabled>Trimite linkul de resetare</button>
    </form>
    <form id="passwordForm" hidden>
      <label for="newPassword">Parola nouă</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="passwordRules">
      <small id="passwordRules">Cel puțin 12 caractere. Folosește o parolă unică.</small>
      <label for="confirmPassword">Confirmă parola</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <button id="savePassword" type="submit">Salvează parola</button>
    </form>
    <p id="passwordStatus" role="status" aria-live="polite"></p>
    <a id="requestAnother" href="password.html" hidden>Solicită un link nou</a>
    <a class="back-link" href="./">Înapoi la autentificare</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=18.43"></script>
  <script src="login-security.js?v=18.43"></script>
  <script src="password-service.js?v=1"></script>
  <script src="password-page.js?v=1"></script>
</body>
</html>
