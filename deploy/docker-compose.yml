services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # The Caddyfile reads {$DEMO_DOMAIN}, {$N8N_HOST} and {$ADMIN_IPS} from
    # its own process environment at runtime. Compose variable substitution
    # only rewrites this YAML file when it's parsed -- it does not by
    # itself put anything into a container's environment, so these three
    # must be listed explicitly or Caddy sees them as empty and fails to
    # start.
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN}
      N8N_HOST: ${N8N_HOST}
      ADMIN_IPS: ${ADMIN_IPS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../website:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    # No published ports: reachable only through Caddy on this network.
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DEMO_DOMAIN}/
      N8N_PROXY_HOPS: "2"          # Cloudflare, then Caddy
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Required by lib/demo-session.js and the unsubscribe token.
      # Without it every Code node calling require('crypto') fails at runtime.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET}
      DEMO_CODE_PEPPER: ${DEMO_CODE_PEPPER}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      DEMO_PUBLIC_ORIGIN: https://${DEMO_DOMAIN}
      GENERIC_TIMEZONE: Europe/Bucharest
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # n8n's own store only. Demo data lives in the dedicated Supabase project.
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  pg_data:
