services:
  caddy:
    # Built rather than pulled, so the Caddyfile and the site are baked in.
    # Coolify rewrites relative bind mounts into its own application directory
    # and creates missing targets as DIRECTORIES -- which makes mounting a
    # single file (./Caddyfile) fail outright, and would turn ../website into
    # an empty directory that Caddy serves as nothing. See caddy.Dockerfile.
    #
    # Context is the repository root because the site lives outside deploy/.
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    # NO published ports, deliberately. Coolify's proxy owns :80 and :443 on
    # the host and terminates TLS; Caddy sits behind it on the compose network
    # and serves plain HTTP. Point Coolify's domain at THIS service, port 80.
    #
    # Caddy is still here rather than being replaced by proxy labels because
    # it does one thing that cannot move: it serves the site and rewrites
    # /api/demo/* to n8n on the SAME ORIGIN, which is the only reason the
    # session cookie can be httpOnly + SameSite=Strict.
    #
    # If it turns out no proxy fronts this host, this is the line to restore:
    #   ports: ["80:80", "443:443"]
    # and drop `auto_https off` plus the http:// prefixes in the Caddyfile.
    expose:
      - "80"
    # The Caddyfile reads these from its own process environment at runtime.
    # Compose variable substitution only rewrites this YAML file when it's
    # parsed -- it does not by itself put anything into a container's
    # environment, so each must be listed explicitly or Caddy sees it as
    # empty and fails to start.
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN}
      N8N_HOST: ${N8N_HOST}
    # Only named volumes here. The Caddyfile and the site are in the image;
    # these two hold Caddy's own state (certificates, autosaved config), which
    # must survive a redeploy.
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:2.28.3
    restart: unless-stopped
    # No published ports, deliberately: n8n is reachable only through Caddy on
    # this network. Publishing a port here would put the editor on the host's
    # public interface, behind nothing.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DEMO_DOMAIN}/
      # Three hops now: Cloudflare -> Coolify's proxy -> Caddy. Undercount and
      # n8n reads a proxy's address as the client; overcount and it trusts a
      # header hop that does not exist.
      N8N_PROXY_HOPS: "3"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # n8n blocks $env inside Code nodes by default, which fails as
      # "access to env vars denied". The demo's Code nodes need three
      # secrets that cannot live in a credential -- an HMAC key, a hash
      # pepper and the Turnstile secret are used in raw JS, not by a node
      # that carries a credential -- so the block is lifted here.
      #
      # The tradeoff, stated plainly: any Code node can now read any of
      # this container's env vars, including N8N_ENCRYPTION_KEY and the
      # Postgres password. That is acceptable only because anyone who can
      # author a Code node already has the editor, and from there can use
      # every stored credential and exfiltrate through an HTTP node anyway.
      # The editor being a trusted surface is the assumption; if that ever
      # stops being true, these secrets need a different home.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Required by lib/demo-session.js and the unsubscribe token.
      # Without it every Code node calling require('crypto') fails at runtime.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET}
      DEMO_CODE_PEPPER: ${DEMO_CODE_PEPPER}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      DEMO_PUBLIC_ORIGIN: https://${DEMO_DOMAIN}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: false
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: false
      EXECUTIONS_DATA_PRUNE: true
      EXECUTIONS_DATA_MAX_AGE: 72
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 250
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_ENABLED_MODULES: data-table
      N8N_DATA_TABLES_MAX_SIZE_BYTES: 104857600      
      GENERIC_TIMEZONE: Europe/Bucharest
    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # n8n's own store only. Demo data lives in the dedicated Supabase project.
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U n8n -d n8n'
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - '-c'
      - max_connections=50
      - '-c'
      - shared_buffers=256MB      

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  pg_data:
